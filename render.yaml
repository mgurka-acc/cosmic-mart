services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: cosmic-mart-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/seed_database.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK
        value: "true"
      - key: FRONTEND_URL
        # Set this to your Render static site URL after first deploy
        value: "https://cosmic-mart.onrender.com"
      # Uncomment and set to enable live Claude mode:
      # - key: ANTHROPIC_API_KEY
      #   sync: false

  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  - type: web
    name: cosmic-mart
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set this to your Render backend URL after first deploy
        value: "https://cosmic-mart-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
